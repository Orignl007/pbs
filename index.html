<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting…</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://www.instagram.com/silva.studios07/">
  <!-- Preconnect so the tracker's TLS handshake starts before the pixel loads. -->
  <link rel="preconnect" href="https://www.mylogos.uk" crossorigin>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #fff;
    }
    a { color: #fff; }
    .px { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <!-- PRIMARY tracker: a plain image, no JavaScript involved. This fires on page
       load even when scripts are blocked, tracking protection is on, or the page
       is opened inside an in-app browser (Instagram's, etc.). -->
  <img class="px" alt="" src="https://www.mylogos.uk/track/pixel?link=ig">

  <p>Redirecting to <a href="https://www.instagram.com/silva.studios07/">@silva.studios07</a>…</p>

  <script>
  // SECONDARY tracker: adds the rich client details the pixel can't see
  // (screen, viewport, timezone, language, platform). Best-effort — the pixel
  // above is what guarantees the open is counted. Both are collapsed into a
  // single "open" server-side, so this never double-counts.
  (function () {
    var TARGET = "https://www.instagram.com/silva.studios07/";
    var BEACON = "https://www.mylogos.uk/track/hit?link=ig";
    try {
      var info = {
        screen: (screen.width + "x" + screen.height),
        viewport: (window.innerWidth + "x" + window.innerHeight),
        dpr: (window.devicePixelRatio || 1),
        tz: ((Intl.DateTimeFormat().resolvedOptions() || {}).timeZone || ""),
        lang: (navigator.language || ""),
        ref: (document.referrer || ""),
        platform: ((navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "")
      };
      var payload = JSON.stringify(info);
      if (navigator.sendBeacon) {
        navigator.sendBeacon(BEACON, new Blob([payload], { type: "text/plain" }));
      } else {
        fetch(BEACON, { method: "POST", body: payload, headers: { "Content-Type": "text/plain" }, keepalive: true, mode: "no-cors" });
      }
    } catch (e) { /* tracking is best-effort — never block the redirect */ }
    // Give the pixel a moment to leave the device before we navigate away.
    // 400ms is imperceptible to a visitor but is the difference between a
    // logged open and a request killed mid-flight on a slow mobile connection.
    setTimeout(function () { location.replace(TARGET); }, 400);
  })();
  </script>

  <!-- No-JS fallback: still forwards even with scripts disabled. -->
  <noscript>
    <meta http-equiv="refresh" content="1; url=https://www.instagram.com/silva.studios07/">
  </noscript>
</body>
</html>
